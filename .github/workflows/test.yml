# Her değişiklikte sistemi dış servis çağırmadan (deneme modu) uçtan uca test eder.
name: Test

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 3"   # her çarşamba: yeni açıklanan paket açıklarını yakalamak için

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q -r requirements.txt
      - name: Testler (gizli anahtar taraması dahil)
        run: python -m pytest -q
      - name: Bağımlılık açığı taraması (pip-audit, ücretsiz OSV/PyPI veritabanı)
        run: |
          pip install -q pip-audit
          # PYSEC-2026-2447 (diskcache, llama.cpp alt paketi): yalnızca önbellek klasörüne yazabilen saldırganı
          # etkiler; sistem bu önbelleği kullanmaz ve sunucu her çalıştırmada sıfırdan kurulur (SECURITY.md).
          pip-audit -r requirements.txt -r requirements-yerel.txt --progress-spinner off --ignore-vuln PYSEC-2026-2447
